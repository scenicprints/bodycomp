name: Wear CI

# Iteration build for the Wear OS module. Runs on pushes to the `wear` branch
# (and on demand) and uploads the watch APK as a workflow artifact — it does
# NOT cut a release. Used to get the native module compiling green before the
# signed watch APK is wired into the real release build.
on:
  push:
    branches: [ wear ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # settings.gradle.kts needs flutter.sdk, and the Android build needs
      # sdk.dir — both live in android/local.properties, which we synthesise
      # here (a normal `flutter build` would write it, but we drive Gradle
      # directly for the :wear module).
      - name: Write local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      # Sign with the real key when the secrets are present, exactly as the
      # release build does. A watch-only change (the face, the watch app) can
      # then be installed straight over the copy on the wrist, without cutting
      # a phone release for it. Without the secrets the build is debug-signed.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key configured; building debug-signed."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build Wear and watch face APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :wear:assembleRelease :watchface:assembleRelease --stacktrace

      # Flutter redirects every module's build dir to the repo-root build/
      # (see android/build.gradle.kts), so the APKs land under build/wear/
      # and build/watchface/.
      - name: Locate built APKs
        run: find build/wear/outputs build/watchface/outputs -name '*.apk' -print

      - name: Upload Wear APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bodycomp-wear-apk
          path: build/wear/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload watch face APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bodycomp-watchface-apk
          path: build/watchface/outputs/apk/**/*.apk
          if-no-files-found: error
